# ~/.codex/config.toml
# Personal Codex defaults. Keep repo-specific behavior in .codex/config.toml.

model = "gpt-5.5"
model_provider = "openai"

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["CLAUDE.md", ".agents.md", "TEAM_GUIDE.md", "CONVENTIONS.md"]
project_root_markers = [".git", ".hg", ".sl"]

[sandbox_workspace_write]
network_access = false
writable_roots = []
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["AWS_*", "AZURE_*", "GCP_*", "*TOKEN*", "*SECRET*", "*KEY*", "*PASSWORD*", "*CREDENTIAL*"]
set = {}
include_only = []

[history]
persistence = "save-all"

[tui]
notifications = true
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]

[features]
codex_hooks = true
multi_agent = true
