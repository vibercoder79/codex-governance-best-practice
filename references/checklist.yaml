version: "0.1"
name: codex-setup-checklist
categories:
  global_config:
    - id: global-config-exists
      severity: high
      check: "~/.codex/config.toml exists"
      recommendation: "Create a user-level config.toml with model, sandbox, approval, and environment defaults."
    - id: global-agents-exists
      severity: high
      check: "~/.codex/AGENTS.md exists"
      recommendation: "Create global AGENTS.md with short personal working agreements."
    - id: global-override-aware
      severity: medium
      check: "~/.codex/AGENTS.override.md absent or intentionally documented"
      recommendation: "Use override files only for temporary overrides and document their presence."
  project_config:
    - id: project-agents-exists
      severity: high
      check: "AGENTS.md exists at repo root"
      recommendation: "Create repo-level AGENTS.md with layout, build/test, constraints, done definition, and conflict handling."
    - id: project-codex-config-exists
      severity: high
      check: ".codex/config.toml exists"
      recommendation: "Create project config for repo-specific sandbox, approval, doc size, and hooks settings."
    - id: project-trust-note
      severity: medium
      check: "Project trust requirement understood"
      recommendation: "Remember that project .codex layers load only when the repo is trusted."
  security:
    - id: approval-policy
      severity: high
      check: "approval_policy is on-request or stricter"
      recommendation: "Use on-request as default; avoid never unless environment is controlled."
    - id: sandbox-mode
      severity: high
      check: "sandbox_mode is workspace-write or read-only"
      recommendation: "Avoid danger-full-access as a default."
    - id: network-access
      severity: high
      check: "sandbox workspace write network access is false by default"
      recommendation: "Keep shell network access disabled unless explicitly needed."
    - id: shell-env-policy
      severity: high
      check: "Shell environment excludes secrets, tokens, and keys"
      recommendation: "Use shell_environment_policy to exclude sensitive environment variables."
  instructions:
    - id: project-doc-size
      severity: medium
      check: "project_doc_max_bytes >= 65536 for larger repos or documented as default"
      recommendation: "Raise limit or split guidance if AGENTS.md/fallback docs are large."
    - id: fallback-filenames
      severity: medium
      check: "project_doc_fallback_filenames intentional"
      recommendation: "Include fallback names only when needed, e.g. CLAUDE.md during migration."
    - id: agents-concise
      severity: medium
      check: "AGENTS.md is concise and does not duplicate full framework docs"
      recommendation: "Move task workflows into skills and references."
    - id: conflict-section
      severity: high
      check: "AGENTS.md contains neutral conflict handling"
      recommendation: "Add precedence model for AGENTS, skills, rules, hooks, and framework docs."
  rules:
    - id: rules-exist
      severity: medium
      check: "rules/default.rules exists where command governance is needed"
      recommendation: "Create rules for destructive, dependency, git, deployment, and network commands."
    - id: rules-inline-tests
      severity: medium
      check: "Rules include match/not_match examples"
      recommendation: "Use inline rule tests and validate with codex execpolicy check."
  hooks:
    - id: hooks-feature-flag
      severity: medium
      check: "codex_hooks feature enabled when hooks are configured"
      recommendation: "Add [features] codex_hooks = true."
    - id: hooks-single-representation
      severity: medium
      check: "No same-layer duplicate hook definitions via hooks.json and inline TOML"
      recommendation: "Prefer hooks.json or inline hooks per layer, not both."
  skills:
    - id: skills-metadata
      severity: medium
      check: "Each SKILL.md has name and concise description"
      recommendation: "Front-load trigger words and boundaries in descriptions."
    - id: skill-scope
      severity: medium
      check: "Skills are focused and do not become mega-frameworks"
      recommendation: "Split broad workflows into skill families."
  review:
    - id: plans-md
      severity: low
      check: "PLANS.md exists for long-running work"
      recommendation: "Use execution plans for complex changes."
    - id: code-review-md
      severity: low
      check: "code_review.md exists for repo review expectations"
      recommendation: "Create a lightweight review template for diff, tests, risks, and acceptance."
